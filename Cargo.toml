[package]
name = "simple-stt"
version = "0.2.5"
edition = "2021"
license = "GPL-2.0-only"
description = "Thin AutoHotkey shell with persistent capture and disposable Parakeet inference worker"
build = "build.rs"
autobins = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
dirs = "6"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ctrlc = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
cpal = "0.17"
libloading = "0.8"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
] }
windows-core = "0.62"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = "0.21"
cpal = "0.17"
libloading = "0.8"
pango = "0.21"
pangocairo = "0.21"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
wayland-client = "0.31"

[[bin]]
name = "simple-stt-capture"
path = "src/bin/simple_stt_capture.rs"

[[bin]]
name = "simple-stt-infer"
path = "src/bin/simple_stt_infer.rs"

[[bin]]
name = "simple-stt-ctl"
path = "src/bin/simple_stt_ctl.rs"

[[bin]]
name = "simple-stt-linux"
path = "src/bin/simple_stt_linux.rs"

[[bin]]
name = "simple_stt_mock_infer"
path = "src/bin/simple_stt_mock_infer.rs"

[[bin]]
name = "overlay-e2e"
path = "src/bin/overlay_e2e.rs"
